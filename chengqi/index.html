<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f6ede1">
<meta name="description" content="成器 — 铜胎掐丝珐琅（景泰蓝）师徒解谜。玉不琢，不成器：一位老师傅和徒弟阿蓝，走过寻矿、制胎、掐丝、点蓝、烧蓝、磨光、镀金，把天上那件空着的器，一道工序一道工序地做成。">
<title>成器 · 景泰蓝师徒解谜</title>
<style>
:root{--paper:#f6ede1;--gold:#b8862e;--gold-soft:rgba(184,134,46,.45);--ink:#4b4262;--ink-soft:rgba(75,66,98,.45);--ts:0 0 12px rgba(255,250,240,.7);--blue:#3fb6a8;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC","SimSun",serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--paper);font-family:var(--serif);color:var(--ink);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{touch-action:none;cursor:pointer}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:1px solid var(--gold);outline-offset:3px}

#chapter,#hud,#hint,#endline,#who{position:absolute;color:var(--ink);opacity:0;transition:opacity .9s ease;pointer-events:none}
#chapter{left:max(24px,env(safe-area-inset-left));top:max(22px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;letter-spacing:.42em}
#chapter i{display:inline-block;width:9px;height:9px;border:1px solid var(--gold);transform:rotate(45deg)}
#chapter.on{opacity:.82}
#hud{right:max(16px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;gap:10px}
#hud.on{opacity:1;pointer-events:auto}
#hud button{width:36px;height:36px;border:1px solid var(--ink-soft);font-size:14px;font-weight:600;line-height:34px;text-align:center;opacity:.82;transition:opacity .2s,background .2s}
#hud button:hover{opacity:1;background:rgba(217,180,90,.1)}
#bmu.off{text-decoration:line-through;opacity:.45}
#who{left:50%;top:max(20px,env(safe-area-inset-top));transform:translateX(-50%);display:flex;gap:6px}
#who.on{opacity:1;pointer-events:auto}
#who button{font-size:13px;font-weight:600;letter-spacing:.3em;padding:7px 12px 7px calc(12px + .3em);border:1px solid transparent;opacity:.5;transition:all .3s}
#who button.sel{border-color:var(--gold);opacity:1;color:var(--gold)}
#hint{left:50%;bottom:max(34px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:15px;font-weight:600;letter-spacing:.24em;white-space:nowrap;text-shadow:var(--ts)}
#hint.on{opacity:.88}
#endline{left:0;right:0;bottom:max(46px,env(safe-area-inset-bottom));text-align:center;text-shadow:var(--ts)}
#endline.on{opacity:1}
#endvase{font-size:13px;font-weight:700;letter-spacing:.6em;padding-left:.6em;color:var(--gold);margin-bottom:14px;opacity:.9}
#endtext{font-size:clamp(18px,2.6vw,24px);font-weight:400;letter-spacing:.3em;padding-left:.3em}
#endgo{display:block;margin-top:22px;font-size:12px;font-weight:700;letter-spacing:.5em;opacity:0;transition:opacity .9s;color:var(--gold)}
#endgo.on{opacity:.7;animation:breath 2.6s ease-in-out infinite}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity 1.1s ease,visibility 0s linear 1.1s;padding:72px 32px}
.screen.on{opacity:1;visibility:visible;transition:opacity .8s ease}
.solid{background:radial-gradient(120% 90% at 50% 40%,#fbf4ea 0%,#f3e6d6 60%,#ead8c6 100%);color:#4b4262}
#veil{position:absolute;inset:0;background:var(--paper);opacity:0;pointer-events:none;transition:opacity .7s ease}
#veil.on{opacity:1;pointer-events:auto}

/* 标题 */
#title{cursor:pointer}
.t-row{display:flex;align-items:flex-start;gap:30px}
.t-name{writing-mode:vertical-rl;font-size:clamp(72px,15vmin,136px);font-weight:300;letter-spacing:.2em;line-height:1;color:var(--ink);text-shadow:0 0 40px rgba(255,250,240,.9)}
.t-side{display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:12px}
.t-gem{width:30px;height:30px;transform:rotate(45deg);border:1.5px solid var(--gold);background:linear-gradient(135deg,#6fd0c2,#3fb6a8 50%,#e0786a 51%,#e0786a);box-shadow:0 0 14px rgba(63,182,168,.5)}
.t-seal{writing-mode:vertical-rl;border:1px solid var(--gold);color:var(--gold);font-size:13px;font-weight:700;letter-spacing:.18em;padding:8px 4px 6px}
.t-pro{margin-top:56px;font-size:15px;font-weight:500;line-height:2.3;letter-spacing:.2em;text-align:center;opacity:.8}
.t-go{margin-top:56px;font-size:13px;font-weight:700;letter-spacing:.5em;padding-left:.5em;color:var(--gold);animation:breath 2.6s ease-in-out infinite}
.t-en{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));font-size:10px;font-weight:700;letter-spacing:.6em;padding-left:.6em;opacity:.4;font-family:Georgia,"Times New Roman",serif}

/* 章节页 */
#card .c-no{font-size:13px;font-weight:700;letter-spacing:.6em;padding-left:.6em;color:var(--gold);opacity:.85}
#card .c-name{margin:30px 0 34px;writing-mode:vertical-rl;font-size:clamp(56px,11vmin,100px);font-weight:300;letter-spacing:.2em;line-height:1;text-shadow:var(--ts)}
#card .c-rule{width:9px;height:9px;border:1px solid var(--gold);transform:rotate(45deg);margin-bottom:30px}
#card .c-craft{font-size:13px;font-weight:500;letter-spacing:.18em;padding-left:.18em;opacity:.55;text-align:center;max-width:26em;line-height:2;margin-bottom:18px}
#card .c-poem{font-size:17px;font-weight:500;letter-spacing:.28em;padding-left:.28em;opacity:.9;text-align:center;max-width:22em;line-height:2}

/* 选章 */
#levels{z-index:5}
#levels h2{font-size:13px;font-weight:700;letter-spacing:.6em;padding-left:.6em;color:var(--gold);margin-bottom:52px}
#lvlist{display:flex;gap:clamp(10px,3vw,34px);flex-direction:row-reverse;flex-wrap:wrap;justify-content:center}
.lv{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 6px;transition:opacity .2s}
.lv-no{width:30px;height:30px;line-height:28px;font-size:13px;font-weight:700;text-align:center;border:1px solid var(--gold-soft)}
.lv.done .lv-no{background:var(--blue);border-color:var(--gold);color:#fff}
.lv-name{writing-mode:vertical-rl;font-size:clamp(22px,4.2vmin,30px);font-weight:400;letter-spacing:.3em}
.lv.locked{opacity:.26;cursor:default}
.lv:not(.locked):hover .lv-name{color:var(--gold)}
#lvclose{margin-top:60px;font-size:13px;font-weight:700;letter-spacing:.5em;padding:10px 18px 10px calc(18px + .5em);opacity:.7}

/* 终章 */
.f-gem{width:clamp(70px,13vmin,110px);aspect-ratio:1;transform:rotate(45deg);border:2px solid var(--gold);background:linear-gradient(135deg,#3a8fe0,#1f5fae 50%,#0f3170);box-shadow:0 0 60px rgba(47,127,208,.55)}
.f-lines{margin-top:60px;text-align:center;max-width:34em}
.f-lines p{font-size:clamp(14px,2vw,17px);font-weight:400;letter-spacing:.2em;padding-left:.2em;line-height:2.3;opacity:0}
.f-lines p.big{font-size:clamp(20px,3vw,26px);letter-spacing:.4em;margin-top:18px;color:var(--gold)}
#finale.on .f-lines p{animation:rise 1.6s ease forwards}
#finale.on .f-lines p:nth-child(1){animation-delay:.8s}
#finale.on .f-lines p:nth-child(2){animation-delay:2.6s}
#finale.on .f-lines p:nth-child(3){animation-delay:4.4s}
#finale.on .f-lines p:nth-child(4){animation-delay:6.6s}
.f-btns{margin-top:48px;display:flex;gap:28px;opacity:0}
#finale.on .f-btns{animation:rise 1.4s ease 8.4s forwards}
.f-btns button{font-size:13px;font-weight:700;letter-spacing:.4em;padding:11px 18px 11px calc(18px + .4em);border:1px solid var(--gold-soft)}
.f-cred{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));font-size:11px;font-weight:600;letter-spacing:.3em;opacity:.4}

#nogl{z-index:9;font-size:15px;letter-spacing:.2em;line-height:2.2;text-align:center}
@keyframes breath{0%,100%{opacity:.35}50%{opacity:.85}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:.92;transform:none}}
@media (prefers-reduced-motion:reduce){.t-go,#endgo.on{animation:none}}
@media (max-width:520px){#hint{font-size:13px;letter-spacing:.14em}.t-pro{font-size:14px}}
body.cap #hud,body.cap #who,body.cap #hint,body.cap #endline{display:none}
</style>
</head>
<body>
<div id="app">
  <canvas id="bg"></canvas>
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>

  <div id="chapter"><i></i><span id="chname"></span></div>
  <div id="who"><button id="w0" class="sel">阿蓝</button><button id="w1">师傅</button></div>
  <div id="hud">
    <button id="blv" aria-label="选择章节" title="章节">章</button>
    <button id="bre" aria-label="重来本章" title="重来 (R)">复</button>
    <button id="bmu" aria-label="声音开关" title="声音 (M)">音</button>
  </div>
  <div id="hint" role="status"></div>
  <div id="endline"><p id="endvase"></p><p id="endtext"></p><span id="endgo">轻触继续</span></div>

  <section id="card" class="screen">
    <div class="c-no" id="cno"></div>
    <h2 class="c-name" id="cname"></h2>
    <div class="c-rule"></div>
    <p class="c-craft" id="ccraft"></p>
    <p class="c-poem" id="cpoem"></p>
  </section>

  <section id="title" class="screen on">
    <div class="t-row">
      <h1 class="t-name">成器</h1>
      <div class="t-side"><div class="t-gem"></div><div class="t-seal">铜胎掐丝珐琅</div></div>
    </div>
    <p class="t-pro">玉不琢，不成器。<br>窑火将熄的年月，老师傅带着徒弟阿蓝，<br>要把天上那件空着的器，一道一道做成。</p>
    <p class="t-go" id="tgo">轻触开始</p>
    <p class="t-en">CHENG QI · THE MAKING OF A VESSEL</p>
  </section>

  <section id="finale" class="screen solid">
    <canvas id="fvase" width="320" height="360" style="position:static;width:200px;height:225px"></canvas>
    <div class="f-lines">
      <p>景泰蓝，即铜胎掐丝珐琅，明代景泰年间技艺成熟，因而得名。</p>
      <p>一九五一年，梁思成、林徽因在清华营建系组织抢救，请回了改行多年的老艺人。</p>
      <p>二〇〇六年，景泰蓝制作技艺列入第一批国家级非物质文化遗产名录。</p>
      <p class="big">窑火重燃，一脉接续。</p>
    </div>
    <div class="f-btns"><button id="again">再走一遍</button><button id="pick">选章</button></div>
    <p class="f-cred">成器 · 画面与声音均由代码实时生成</p>
  </section>

  <section id="levels" class="screen solid">
    <h2>七道工序</h2>
    <div id="lvlist"></div>
    <button id="lvclose">返回</button>
  </section>

  <div id="veil"></div>
  <section id="nogl" class="screen solid"><p>这台设备的浏览器没有开启 WebGL，<br>换一个现代浏览器再来看看这抹蓝吧。</p></section>
</div>
<script src="js/levels.js"></script>
<script src="js/logic.js"></script>
<script src="js/gfx.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
