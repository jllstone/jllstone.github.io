<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2238">
<meta name="description" content="成器 — 铜胎掐丝珐琅（景泰蓝）师徒解谜。玉不琢，不成器：一位老师傅和徒弟阿蓝，俯身走进一只空着的铜胎，走过寻矿、制胎、掐丝、点蓝、烧蓝、磨光、镀金，器成，人也成。">
<title>成器 · 景泰蓝师徒解谜</title>
<style>
:root{--paper:#1b2238;--gold:#d9b45a;--gold-soft:rgba(217,180,90,.5);--ink:#efe8da;--ink-soft:rgba(239,232,218,.45);--ts:0 1px 10px rgba(0,0,0,.45);--tq:#3fb6a8;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC","SimSun",serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--paper);font-family:var(--serif);color:var(--ink);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{touch-action:none;cursor:pointer}
#tr{pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
svg{display:block}

#chapter,#hud,#hint,#endline,#who{position:absolute;color:var(--ink);opacity:0;transition:opacity .9s ease;pointer-events:none}
#chapter{left:max(20px,env(safe-area-inset-left));top:max(20px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;letter-spacing:.36em;white-space:nowrap;text-shadow:var(--ts);max-width:calc(100% - 170px);overflow:hidden}
#chapter i{flex:none;display:inline-block;width:8px;height:8px;border:1px solid var(--gold);transform:rotate(45deg)}
#chapter.on{opacity:.85}
/* 右上角：图标按钮（信息密集时不再用文字） */
#hud{right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:8px}
#hud.on{opacity:1;pointer-events:auto}
#hud button{width:38px;height:38px;border-radius:50%;border:1px solid var(--ink-soft);display:grid;place-items:center;opacity:.85;transition:opacity .2s,background .2s}
#hud button:hover{opacity:1;background:rgba(217,180,90,.12)}
#hud svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
#bmu .x{display:none}#bmu.off .x{display:inline}#bmu.off .w{display:none}#bmu.off{opacity:.5}
/* 左下角：师徒切换（头像图标） */
#who{left:max(14px,env(safe-area-inset-left));bottom:max(96px,calc(env(safe-area-inset-bottom) + 84px));display:flex;flex-direction:column;gap:10px}
#who.on{opacity:1;pointer-events:auto}
#who button{width:50px;height:50px;border-radius:50%;border:1.5px solid var(--ink-soft);background:rgba(10,12,22,.28);display:grid;place-items:center;opacity:.6;transition:all .3s;position:relative}
#who button.sel{border-color:var(--gold);opacity:1;box-shadow:0 0 0 3px rgba(217,180,90,.18),0 0 18px rgba(217,180,90,.35)}
#who button span{position:absolute;left:58px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;letter-spacing:.3em;white-space:nowrap;opacity:0;transition:opacity .3s;text-shadow:var(--ts)}
#who button.sel span{opacity:.9}
#who svg{width:34px;height:34px}
#say{position:absolute;left:50%;top:max(66px,calc(env(safe-area-inset-top) + 54px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;pointer-events:none;width:max-content;max-width:calc(100% - 40px);text-align:center;text-shadow:var(--ts);color:var(--ink);padding:10px 26px;background:radial-gradient(closest-side,var(--scrim,rgba(6,8,16,.42)),rgba(0,0,0,0))}
#say.on{animation:sayin 2.8s ease forwards}
#say b{font-size:11px;font-weight:700;letter-spacing:.5em;padding-left:.5em;color:var(--gold)}
#say span{font-size:clamp(15px,2.2vw,19px);font-weight:500;letter-spacing:.22em;padding-left:.22em;line-height:1.6}
@keyframes sayin{0%{opacity:0;transform:translate(-50%,6px)}14%{opacity:1;transform:translate(-50%,0)}82%{opacity:1}100%{opacity:0}}
body.opening #chapter,body.opening #bre,body.opening #who,body.opening #hint{display:none}
#hint{left:50%;bottom:max(30px,calc(env(safe-area-inset-bottom) + 16px));transform:translateX(-50%);font-size:15px;font-weight:600;letter-spacing:.22em;text-align:center;width:max-content;max-width:calc(100% - 140px);line-height:1.7;text-shadow:var(--ts)}
#hint.on{opacity:.9}
#endline{left:0;right:0;bottom:max(56px,calc(env(safe-area-inset-bottom) + 40px));text-align:center;text-shadow:var(--ts)}
#endline.on{opacity:1}
#endvase{font-size:13px;font-weight:700;letter-spacing:.6em;padding-left:.6em;color:var(--gold);margin-bottom:14px;opacity:.9}
#endtext{font-size:clamp(18px,2.6vw,26px);font-weight:400;letter-spacing:.3em;padding:0 1em 0 1.3em}
#endgo{display:block;margin-top:22px;font-size:12px;font-weight:700;letter-spacing:.5em;opacity:0;transition:opacity .9s;color:var(--gold)}
#endgo.on{opacity:.75;animation:breath 2.6s ease-in-out infinite}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity 1.1s ease,visibility 0s linear 1.1s;padding:72px 28px}
.screen.on{opacity:1;visibility:visible;transition:opacity .8s ease}
.solid{background:radial-gradient(120% 90% at 50% 40%,#2a3354 0%,#161c33 60%,#0b0f1f 100%);color:#efe8da}
#veil{position:absolute;inset:0;background:#0b0e1a;opacity:0;pointer-events:none;transition:opacity .7s ease}
#veil.on{opacity:1;pointer-events:auto}

#title{cursor:pointer}
.t-row{display:flex;align-items:flex-start;gap:30px}
.t-name{writing-mode:vertical-rl;font-size:clamp(72px,15vmin,136px);font-weight:300;letter-spacing:.2em;line-height:1;color:var(--ink);text-shadow:0 0 40px rgba(63,182,168,.35)}
.t-side{display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:12px}
.t-gem{width:28px;height:28px;transform:rotate(45deg);border:1.5px solid var(--gold);background:linear-gradient(135deg,#6fd0c2,#3fb6a8 50%,#e0786a 51%,#e0786a);box-shadow:0 0 14px rgba(63,182,168,.5)}
.t-seal{writing-mode:vertical-rl;border:1px solid var(--gold);color:var(--gold);font-size:13px;font-weight:700;letter-spacing:.18em;padding:8px 4px 6px}
.t-pro{margin-top:52px;font-size:15px;font-weight:500;line-height:2.3;letter-spacing:.2em;text-align:center;opacity:.82}
.t-go{margin-top:52px;font-size:13px;font-weight:700;letter-spacing:.5em;padding-left:.5em;color:var(--gold);animation:breath 2.6s ease-in-out infinite}
.t-en{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));font-size:10px;font-weight:700;letter-spacing:.6em;padding-left:.6em;opacity:.4;font-family:Georgia,"Times New Roman",serif}

#card .c-no{font-size:13px;font-weight:700;letter-spacing:.6em;padding-left:.6em;color:var(--gold);opacity:.85;text-shadow:var(--ts)}
#card .c-name{margin:30px 0 34px;writing-mode:vertical-rl;font-size:clamp(56px,11vmin,100px);font-weight:300;letter-spacing:.2em;line-height:1;text-shadow:var(--ts)}
#card .c-rule{width:9px;height:9px;border:1px solid var(--gold);transform:rotate(45deg);margin-bottom:30px}
#card .c-poem{font-size:17px;font-weight:500;letter-spacing:.28em;padding-left:.28em;opacity:.9;text-align:center;max-width:22em;line-height:2;text-shadow:var(--ts)}

#levels{z-index:5}
#levels h2{font-size:13px;font-weight:700;letter-spacing:.6em;padding-left:.6em;color:var(--gold);margin-bottom:52px}
#lvlist{display:flex;gap:clamp(10px,3vw,34px);flex-direction:row-reverse;flex-wrap:wrap;justify-content:center}
.lv{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 6px;transition:opacity .2s}
.lv-no{width:30px;height:30px;line-height:28px;font-size:13px;font-weight:700;text-align:center;border:1px solid var(--gold-soft)}
.lv.done .lv-no{background:var(--tq);border-color:var(--gold);color:#fff}
.lv-name{writing-mode:vertical-rl;font-size:clamp(22px,4.2vmin,30px);font-weight:400;letter-spacing:.3em}
.lv.locked{opacity:.26;cursor:default}
.lv:not(.locked):hover .lv-name{color:var(--gold)}
#lvclose{margin-top:60px;font-size:13px;font-weight:700;letter-spacing:.5em;padding:10px 18px 10px calc(18px + .5em);opacity:.7}

/* 终章：文字落在叠合成形的大器下方，史实退为角标 */
#finale{justify-content:flex-end;padding:0 24px max(18px,env(safe-area-inset-bottom));color:#efe8da;pointer-events:none}
#finale.on{pointer-events:auto}
.f-big{font-size:clamp(26px,4vw,40px);font-weight:400;letter-spacing:.5em;padding-left:.5em;text-shadow:0 0 18px rgba(255,248,236,.9);opacity:0}
.f-sub{font-size:clamp(14px,2vw,17px);letter-spacing:.4em;padding-left:.4em;color:#e8c46a;opacity:0}
#finale.on .f-big{animation:rise 1.6s ease .3s forwards}
#finale.on .f-sub{animation:rise 1.4s ease .2s forwards}
.f-btns{margin-top:18px;display:flex;gap:18px;opacity:0}
#finale.on .f-btns{animation:rise 1.4s ease 1.2s forwards}
.f-btns button{font-size:13px;font-weight:700;letter-spacing:.4em;padding:10px 16px 10px calc(16px + .4em);border:1px solid rgba(232,196,106,.45);color:#efe8da}
.f-cred{margin-top:16px;max-width:min(34em,100%);text-align:center;font-size:10px;line-height:1.8;letter-spacing:.1em;opacity:0}
#finale.on .f-cred{animation:credin 1.6s ease 2.2s forwards}
@keyframes credin{to{opacity:.42}}
@media (min-aspect-ratio:11/10){#finale{justify-content:flex-end;align-items:center;padding-left:42vw;padding-bottom:max(36px,env(safe-area-inset-bottom))}}

#nogl{z-index:9;font-size:15px;letter-spacing:.2em;line-height:2.2;text-align:center}
@keyframes breath{0%,100%{opacity:.35}50%{opacity:.85}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:.95;transform:none}}
@media (prefers-reduced-motion:reduce){.t-go,#endgo.on{animation:none}}
@media (max-width:560px){
  #chapter{font-size:13px;letter-spacing:.18em;gap:8px;left:max(14px,env(safe-area-inset-left));top:max(18px,env(safe-area-inset-top))}
  #hud{gap:6px}#hud button{width:34px;height:34px}#hud svg{width:16px;height:16px}
  #hint{font-size:13px;letter-spacing:.12em}
  #who button{width:44px;height:44px}#who svg{width:30px;height:30px}
  .t-pro{font-size:14px}
  .t-en{font-size:9px;letter-spacing:.32em;padding-left:.32em}
}
body.cap #hud,body.cap #who,body.cap #hint,body.cap #endline{display:none}
</style>
</head>

  <div id="chapter"><i></i><span id="chname"></span></div>
  <div id="who">

    <button id="w1" aria-label="师傅" title="师傅（Tab 切换）"><svg viewBox="0 0 34 34"><path d="M8 31 Q11 19 13.5 16 L20.5 16 Q23 19 26 31 Z" fill="#5a3a2a"/><rect x="14" y="20" width="6" height="9" fill="#3f7f74"/><circle cx="17" cy="11.5" r="4.6" fill="#f2dcc4"/><path d="M12.4 11a4.6 4.6 0 0 1 9.2 0z" fill="#d8d4cc"/><path d="M15 15.5 L17 19 L19 15.5Z" fill="#d8d4cc"/><circle cx="15.3" cy="12" r="1.3" fill="none" stroke="#d9b45a" stroke-width=".8"/><circle cx="18.7" cy="12" r="1.3" fill="none" stroke="#d9b45a" stroke-width=".8"/></svg><span>师傅</span></button>
  </div>
  <div id="hud">
    <button id="blv" aria-label="选择章节" title="章节"><svg viewBox="0 0 20 20"><path d="M10 2.5 13.2 5.7 10 8.9 6.8 5.7Z M4.8 7.7 8 10.9 4.8 14.1 1.6 10.9Z M15.2 7.7 18.4 10.9 15.2 14.1 12 10.9Z M10 12.9 13.2 16.1 10 19.3 6.8 16.1Z"/></svg></button>
    <button id="bre" aria-label="重来本章" title="重来 (R)"><svg viewBox="0 0 20 20"><path d="M16 10.5a6 6 0 1 1-2-4.5"/><path d="M14.6 2.6 14.2 6.4 10.4 6"/></svg></button>
    <button id="bmu" aria-label="声音开关" title="声音 (M)"><svg viewBox="0 0 20 20"><path d="M3 8h3l4-3.5v11L6 12H3z"/><path class="w" d="M13 7.5a3.5 3.5 0 0 1 0 5M15.2 5.3a6.6 6.6 0 0 1 0 9.4"/><path class="x" d="M13.5 7.5l4 5M17.5 7.5l-4 5"/></svg></button>
  </div>
  <div id="say" aria-live="polite"><b id="saywho"></b><span id="saytext"></span></div>
  <div id="hint" role="status"></div>
  <div id="endline"><p id="endvase"></p><p id="endtext"></p><span id="endgo">轻触继续</span></div>

  <section id="card" class="screen">
    <div class="c-no" id="cno"></div>
    <h2 class="c-name" id="cname"></h2>
    <div class="c-rule"></div>
    <p class="c-poem" id="cpoem"></p>
  </section>

  <section id="title" class="screen">
    <div class="t-row">
      <h1 class="t-name">成器</h1>
      <div class="t-side"><div class="t-gem"></div><div class="t-seal">铜胎掐丝珐琅</div></div>
    </div>
    <p class="t-pro">玉不琢，不成器。<br>窑火将熄的年月，老师傅带着徒弟阿蓝，<br>俯身走进一只还空着的铜胎。</p>
    <p class="t-go" id="tgo">轻触开始</p>
    <p class="t-en">CHENG QI · THE MAKING OF A VESSEL</p>
  </section>

  <section id="finale" class="screen">
    <p class="f-sub">窑火重燃，一脉接续。</p>
    <div class="f-btns"><button id="again">再走一遍</button><button id="pick">选章</button></div>
    <p class="f-cred">景泰蓝，即铜胎掐丝珐琅，明代景泰年间技艺成熟，因而得名。一九五一年，梁思成、林徽因组织抢救，请回改行多年的老艺人。二〇〇六年，景泰蓝制作技艺列入第一批国家级非物质文化遗产名录。谨以此作，致敬所有守着火的人。</p>
  </section>

  <section id="levels" class="screen solid">
    <h2>七道工序</h2>
    <div id="lvlist"></div>
    <button id="lvclose">返回</button>
  </section>

  <div id="veil"></div>
  <section id="nogl" class="screen solid"><p>这台设备的浏览器没有开启 WebGL，<br>换一个现代浏览器再来看看这抹蓝吧。</p></section>
</div>
