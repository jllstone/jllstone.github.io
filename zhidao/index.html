<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>立体绘本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;600&display=swap">
<link rel="stylesheet" href="engine/style.css">
</head>
<body>
<main id="table" aria-label="可翻页的立体绘本">
  <canvas id="world" tabindex="0" role="img" aria-label="桌上摊开的一本立体书"></canvas>
  <div id="fallback" hidden><img alt=""><p>当前设备不支持 3D，显示平面版。</p></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="head">
    <div class="brand"><span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M3 6.5C6 5 9 5 12 7c3-2 6-2 9-.5V19c-3-1.5-6-1.5-9 .5-3-2-6-2-9-.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 7v12.5" stroke="currentColor" stroke-width="1.6"/></svg></span>
      <div><b id="brandTitle"></b><small id="brandSub"></small></div></div>
    <nav aria-label="工具">
      <button id="editBtn" class="tool" hidden><span>摆位</span></button>
      <button id="lookBtn" class="tool"><span>回到座位</span></button>
      <button id="soundBtn" class="tool icon" aria-pressed="false" aria-label="声音"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5c1.6 1.8 1.6 5.2 0 7M18.6 6c3 3.2 3 8.8 0 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <button id="mapBtn" class="tool"><span>地图</span></button>
    </nav>
  </header>

  <section class="chapter" aria-live="polite">
    <div class="eyebrow" id="folio"></div>
    <h1 id="heading"></h1>
    <p id="place"></p>
    <p id="hint"></p>
  </section>

  <div id="bubbles" aria-hidden="true"></div>

  <div class="bottom">
    <div class="narration">
      <div class="journey" id="journey"></div>
      <p id="line"></p>
      <button id="readBtn" class="link"><span>读这一页</span></button>
    </div>
    <div class="transport">
      <div class="turn-label"><span id="turnHint"></span><b id="counter"></b></div>
      <div class="rail-row">
        <button id="prev" class="round" aria-label="上一章"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="rail"><div id="dots" aria-hidden="true"></div><input id="scrub" type="range" min="0" max="4" step="0.01" value="0" aria-label="慢慢翻页"></div>
        <button id="next" class="round" aria-label="下一章"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <div id="loading"><p id="loadingText"></p><div class="bar"><i id="loadingBar"></i></div></div>

  <aside id="editor" hidden aria-label="摆位编辑器">
    <header><b>摆位编辑</b><button data-close aria-label="关闭编辑">×</button></header>
    <div class="sel"></div>
    <div class="out"><span>本章摆位预览（点「复制 JSON」拿到完整内容，粘回 book.json 对应章节）</span><pre tabindex="0"></pre></div>
    <button data-copy class="primary">复制 JSON</button>
  </aside>
</main>

<dialog id="pageDlg" aria-labelledby="pgTitle"><div class="inside">
  <button class="close" aria-label="关闭">×</button>
  <div class="eyebrow" id="pgFolio"></div><h2 id="pgTitle"></h2><div id="pgBody"></div>
</div></dialog>
<dialog id="mapDlg" aria-labelledby="mapTitle"><div class="inside wide">
  <button class="close" aria-label="关闭">×</button>
  <div class="eyebrow">FOLD-OUT MAP</div><h2 id="mapTitle"></h2><div id="chart"></div><p id="stampLine"></p>
</div></dialog>
<p id="announce" class="sr" role="status" aria-live="polite"></p>

<script type="module">
import { boot } from './engine/reader.js';
boot({ bookUrl: 'book.json' }).catch(e => { document.getElementById('loadingText').textContent = '载入失败：' + e.message; console.error(e); });
</script>
</body>
</html>
